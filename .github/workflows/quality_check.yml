name: quality_check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install nightly rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly
          components: rustfmt

      - name: install taplo
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: taplo-cli@0.10.0

      - name: taplo fmt
        run: taplo fmt --check

      - name: cargo fmt
        run: cargo +nightly fmt --all -- --check

  planning:
    name: planning
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install taplo
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: taplo-cli@0.10.0

      - name: install jq
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq

      - name: validate planning contracts
        run: scripts/validate-planning-docs.sh

      - name: reject invalid planning fixtures
        run: scripts/validate-planning-docs.sh --self-test

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install platform dependencies
        run: &install-platform-deps
          |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libfontconfig1-dev libfreetype6-dev libx11-dev libxext-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libudev-dev libvulkan-dev

      - name: install MSRV toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.0
          components: clippy

      - name: verify MSRV
        run: test "$(rustc +1.96.0 --version --verbose | awk '$1 == "release:" { print $2 }')" = "1.96.0"

      - name: cargo check
        run: cargo +1.96.0 check --workspace --all-targets --all-features --locked

      - name: cargo clippy
        run: cargo +1.96.0 clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        run: cargo +1.96.0 test --workspace --all-features --locked

  stable:
    name: stable
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install platform dependencies
        run: *install-platform-deps

      - name: install stable rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy

      - name: report stable toolchain
        run: rustc +stable --version --verbose

      - name: cargo check
        run: cargo +stable check --workspace --all-targets --all-features --locked

      - name: cargo clippy
        run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        run: cargo +stable test --workspace --all-features --locked

  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install MSRV toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.0
          components: clippy

      - name: cargo check
        run: cargo +1.96.0 check --workspace --all-targets --all-features --locked

      - name: cargo clippy
        run: cargo +1.96.0 clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        run: cargo +1.96.0 test --workspace --all-features --locked

  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install MSRV toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.0
          components: clippy

      - name: cargo check
        run: cargo +1.96.0 check --workspace --all-targets --all-features --locked

      - name: cargo clippy
        run: cargo +1.96.0 clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        run: cargo +1.96.0 test --workspace --all-features --locked

  features:
    name: features
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install platform dependencies
        run: *install-platform-deps

      - name: install MSRV toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.0

      - name: install cargo-hack
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: cargo-hack@0.6.45

      - name: verify cargo-hack
        run: test "$(cargo hack --version)" = "cargo-hack 0.6.45"

      - name: feature powerset check
        run: cargo +1.96.0 hack check --feature-powerset --depth 1 --locked

  dependency-policy:
    name: dependency-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install stable rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable

      - name: install cargo-deny
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: cargo-deny@0.20.2

      - name: verify cargo-deny
        run: test "$(cargo deny --version)" = "cargo-deny 0.20.2"

      - name: cargo deny
        run: cargo deny --locked --workspace check
