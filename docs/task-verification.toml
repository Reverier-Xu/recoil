quality_timeout_seconds = 1800
schema                  = "recoil.woooo.tech/schemas/task-verification-v1"
status                  = "accepted"

# `Q`, the repository quality suite. Every task with include_quality = true
# runs this in addition to its focused verification argv.
quality_argv = [
  [
    "taplo",
    "fmt",
    "--check",
  ],
  [
    "cargo",
    "+nightly",
    "fmt",
    "--all",
    "--",
    "--check",
  ],
  [
    "cargo",
    "check",
    "--workspace",
    "--all-targets",
    "--all-features",
    "--locked",
  ],
  [
    "cargo",
    "clippy",
    "--workspace",
    "--all-targets",
    "--all-features",
    "--locked",
    "--",
    "-D",
    "warnings",
  ],
  [
    "cargo",
    "test",
    "--workspace",
    "--all-features",
    "--locked",
  ],
  [
    "scripts/validate-planning-docs.sh",
  ],
]
[[task]]
id              = "T-G00-01"
include_quality = true
state           = "ready"
verification_id = "VERIFY-G00-01"

[[verification]]
argv            = ["cargo", "check", "--workspace", "--all-targets", "--locked"]
id              = "VERIFY-G00-01"
owner_task      = "T-G00-01"
state           = "ready"
timeout_seconds = 600

[[task]]
id              = "T-G00-02"
include_quality = true
state           = "ready"
verification_id = "VERIFY-G00-02"

