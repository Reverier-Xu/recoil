[graph]
all-features = true

[advisories]
# `unmaintained` is scoped to workspace crates: the pinned gpui/woocraft
# graph transitively depends on unmaintained crates (ttf-parser, rustybuzz,
# paste) that only an upstream bump can replace. Re-evaluate on every
# woocraft rev bump.
ignore       = []
unmaintained = "workspace"
unsound      = "all"
yanked       = "deny"

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "bzip2-1.0.6",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
include-dev = true

[licenses.private]
ignore = true

[bans]
allow-wildcard-paths          = true
highlight                     = "all"
multiple-versions             = "deny"
multiple-versions-include-dev = true
wildcards                     = "deny"
# Duplicate-version skips are forced by the pinned gpui/woocraft graph.
# Each entry carries the same standing reason; re-evaluate the whole list on
# every dependency update and remove entries that stop being necessary.
skip = [
  { crate = "bitflags@1.3.2", reason = "forced by the pinned gpui/woocraft graph; re-evaluate on dependency updates" },
  { crate = "getrandom@0.2.17", reason = "forced by the pinned gpui/woocraft graph; re-evaluate on dependency updates" },
  { crate = "getrandom@0.3.4", reason = "forced by the pinned gpui/woocraft graph; re-evaluate on dependency updates" },
