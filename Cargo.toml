[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
authors      = ["Reverier-Xu <reverier.xu@woooo.tech>"]
description  = "IDE-style terminal emulator built on woocraft and GPUI."
edition      = "2024"
homepage     = "https://recoil.woooo.tech"
license      = "GPL-2.0-or-later"
readme       = "README.md"
repository   = "https://github.com/Reverier-Xu/recoil"
rust-version = "1.96"
version      = "0.0.1"

# Everything GUI-related must enter through the `woocraft` re-exports so the
# workspace resolves the exact upstream revisions of gpui and
# woocraft-terminal. Never add direct git dependencies on gpui, zed, or
# alacritty; see AGENTS.md and docs/roadmap.md architecture rules.
[workspace.dependencies]
recoil-core = { path = "crates/recoil-core" }
woocraft = { git = "https://github.com/Reverier-Xu/woocraft", rev = "b84ede1576d55551adf79c2b6d995ba9b8391cef", default-features = false, features = [
  "terminal",
] }
woocraft-terminal = { git = "https://github.com/Reverier-Xu/woocraft", rev = "b84ede1576d55551adf79c2b6d995ba9b8391cef", package = "woocraft-terminal" }
# gpui and its platform bootstrap. These must stay direct deps because gpui
# proc macros emit `::gpui::` absolute paths — but they must NOT pin a rev:
# woocraft floats its zed deps on main, and a differing rev would make cargo
# resolve two full gpui stacks (one per source), breaking every re-exported
# type. The concrete commit is locked in Cargo.lock; run `cargo update` for
# zed sources only together with a woocraft bump.
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", features = [
  "font-kit",
  "wayland",
  "x11",
] }

anyhow = "1.0"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
  "std",
] }
notify = "7"
# Already pinned in the lock graph through gpui_shared_string; the config
# JSON Schema export adds no new packages.
rust-i18n          = "4"
schemars           = "1"
serde              = { version = "1.0", features = ["derive"] }
serde_json         = "1.0"
thiserror          = "2.0"
toml               = "1.1"
tracing            = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid               = { version = "1.2", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro    = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo         = "deny"

[profile.release]
codegen-units = 1
lto           = "thin"
opt-level     = 3
strip         = true
